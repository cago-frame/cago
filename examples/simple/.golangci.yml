version: "2"
linters:
  enable:
    - bodyclose
    - cagolint
    - copyloopvar
    - durationcheck
    - gosec
    - loggercheck
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - rowserrcheck
    - staticcheck

  settings:
    custom:
      cagolint:
        type: module
        description: Checks Cago framework structure and conventions.
        original-url: https://github.com/cago-frame/cago/tree/main/tools/cagolint
        settings:
          api-dir: /internal/api
          controller-dir: /internal/controller/
          service-dir: /internal/service/
          repository-dir: /internal/repository/
          entity-dir: /internal/model/entity/
    gosec:
      excludes:
        - G115
        - G301
        - G302
        - G306
        - G401
        - G402
        - G404
        - G501
        - G505
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 10m
