{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "cago.fullname" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "cago.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range .Values.httpRoute.sectionNames }}
    - name: {{ $.Values.httpRoute.gateway.name }}
      namespace: {{ $.Values.httpRoute.gateway.namespace }}
      sectionName: {{ . }}
    {{- end }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        {{- range .Values.httpRoute.paths }}
        - path:
            type: PathPrefix
            value: {{ . | quote }}
        {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.service.port }}
{{- end }}
